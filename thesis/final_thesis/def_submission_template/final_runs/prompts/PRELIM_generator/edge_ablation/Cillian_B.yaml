# PROMPT ARCHIVE COPY (thesis deliverable)
# category: PRELIM_generator.edge_ablation
# copied_from: data_science/parameter_tuning_experiments/alternative_prompts/unused_prompts/prompts_cillian_B_formatfixed.yaml
# copied_on: 2026-01-10
# copied_to: thesis/final_thesis/def_submission_template/final_runs/prompts/PRELIM_generator/edge_ablation/Cillian_B.yaml

prompts:
  - prompt_id: generateNodes
    variables:
      - name: target
        type: string
        description: The target variable for the Model.
      - name: target_definition
        type: string
        description: The user provided definition of the selected target variable.
      - name: temporal
        type: string
        description: The temporal scale of the causality study.
      - name: spatial
        type: string
        description: The spatial scale of the causality study.
      - name: context
        type: list
        description: List of key contextual factors for the Model
    prompts:
      sys_prompt: >
        You are a causal discovery agent. Your mission is to identify ONE potential intervention point - a variable whose change would directly cause a change in the target variable, given the specific system boundaries (context, time, spatial space).
        The variable must be:
        - Directly impactful (changing it affects the target without intermediate variables in the exclusion list).
        - Conceptually clear and definable.
        - Observable or measurable in principle.
        - Not an aggregate index or synonym of the target/excluded variables.
        
        The output must be strictly in the format of the following example: 
        
        {"Variable":"Concise name of the variable", 
        "Definition":"Definition of the variable", 
        "Units":"Units of measurements for the variable"} 
        
        Provide nothing else.

      usr_prompt: |
        Target Variable: {{ target.title() }}
        Temporal Scale: {{ temporal.title() }}
        Spatial Scale: {{ spatial.title() }}
        Context: {{ context | join(', ') }}
        
        Think: If you could directly manipulate or observe a change in a factor, which single factor would most directly cause "{{ target.lower() }}" to change within the {{ temporal.lower() }} timeframe and {{ spatial.lower() }} area?

        Requirements for the factor (variable):
        1. Direct Cause: Changing this factor directly impacts {{ target.lower() }}.
        2. Clear & Concise Name: Use 2-4 informative words.
        3. Specific Definition: Explain what the variable represents clearly.
        4. Measurable/Observable: It should be possible to track changes in this variable.
        5. Not Composite: Avoid broad indexes (e.g., prefer 'Rainfall Amount' over 'Climate Conditions').

        The output must be exactly in the format of the following example: 
        {"Variable":"Concise name of the variable", 
        "Definition":"Definition of the variable", 
        "Units":"Units of measurements for the variable"}
      usr_prompt_extension: " The variable cannot be the same as or overlap with anything in the following list: "
    version: 0.0.1
  - prompt_id: generateEdges
    variables:
      - name: var1
        type: str
        description: First variable in undefined relationship.
      - name: var2
        type: str
        description: Second variable in undefined relationship.
      - name: def1
        type: str
        description: Definition of first variable.
      - name: def2
        type: str
        description: Definition of second variable.
      - name: spatial
        type: str
        description: The spatial scale of the causality study.
      - name: temporal
        type: str
        description: The temporal scale of the causality study.
      - name: variables
        type: list[string]
        description: List of existing variables in the CLD.
    prompts:
      sys_prompt: >
        You are a causal link validator. Given two variables and their definitions, determine if a direct causal pathway exists from the first to the second within the specified scales. Explain the mechanism briefly if a link exists. Distinguish causation from correlation and identify mediation by existing variables. Respond strictly in the format RELATIONSHIP:<TYPE>:<brief explanation focusing on mechanism or lack thereof>.

      usr_prompt: | 
        Proposed Causal Link: "{{ var1 }}" ({{ def1 }})  ==>  "{{ var2 }}" ({{ def2 }})
        Spatial Context: "{{ spatial }}"
        Temporal Context: "{{ temporal }}"
        Potential Mediators: {{ variables | join(", ") }}

        Assess this proposed direct causal link:
        1.  Mechanism Identification: Is there a plausible how or why (a mechanism) based on the definitions for "{{ var1 }}" to directly influence "{{ var2 }}" within the given spatial and temporal context?
        2.  Correlation vs. Causation: Is the link truly causal, or could it be just a correlation (e.g., both driven by a third factor)?
        3.  Mediation Check: Is the entire plausible effect of "{{ var1 }}" on "{{ var2 }}" transmitted through one or more variables in the Potential Mediators list [{{ variables | join(", ") }}]? If yes, the direct link is NONE.
        4.  Link Classification (if direct & non-mediated):
               POSITIVE: Mechanism involves increase->increase or decrease->decrease.
               NEGATIVE: Mechanism involves increase->decrease or decrease->increase.
               DELAYED: The mechanism inherently takes significant time relative to the '{{ temporal }}' scale.
               NONLINEAR: The mechanism suggests the effect strength changes disproportionately.
               NONE: No plausible direct mechanism, link is correlational, operates outside scales, or is fully mediated.

        Provide a brief (max 4 sentences) explanation focusing on the mechanism (or lack thereof) and mediation. 

        Example (Positive Mechanism): 
        {"Relationship":"POSITIVE","Explanation":"Increased 'Study Hours' (time spent studying) directly causes improved 'Exam Score' (performance on exam) through the mechanism of knowledge acquisition and retention, relevant within a semester (temporal) and university (spatial) context."}

        Example (None - Correlation): 
        {"Relationship":"NONE","Explanation":"While 'Number of Firefighters' and 'Fire Damage Cost' might correlate, the mechanism is not direct causation; both are driven by 'Fire Size'. No direct causal link from firefighters to damage cost based on definitions."}

        Example (None - Mediated): 
        {"Relationship":"NONE","Explanation":"The effect of 'Marketing Budget' on 'Revenue' operates entirely through the mechanism of increasing 'Customer Acquisition', which is listed as a potential mediator."}


        Now, validate the link between "{{ var1 }}" and "{{ var2 }}", taking particular care to make sure the relationships are causal and not just correlated or associated.

        Respond only in the format: {"Relationship":"TYPE","Explanation":"A brief explanation."}


      usr_prompt_extension: ""
    version: 0.0.1
  - prompt_id: edgeVerifier
    variables:
      - name: edge_description
        type: string
        description: The textual description for an edge relationship
    prompts:
      sys_prompt: |
        Be precise. Only respond with either:
        - OK
        - INCONSISTENT:<short reason>

      usr_prompt: |
        Evaluate the following edge description for internal or logical consistency:
        "{{ edge_description }}"

        Step 1: Identify the proposed cause and effect variables.
        Step 2: Analyze the temporal sequence (cause must precede effect).
        Step 3: Assess plausible causal mechanisms.
        Step 4: Identify potential confounders or mediators.
        Step 5: Check for logical fallacies or reasoning errors.
        Step 6: Evaluate if evidence supports a direct causal link.
        Step 7: Provide your final judgment (OK or INCONSISTENT).

        If the description is self-consistent, respond with `OK`.
        If the description is not self-consistent, respond with `INCONSISTENT:` 
        followed by a brief explanation.

      usr_prompt_extension: ""
    version: 0.0.1
  - prompt_id: generateSpuriousMotivation
    variables:
      - name: source
        type: string
        description: The source variable in the relationship
      - name: target
        type: string
        description: The target variable in the relationship  
      - name: relationship
        type: string
        description: The type of relationship between the variables
      - name: motivation
        type: string
        description: The original motivation for the relationship
    prompts:
      sys_prompt: |
        You are an expert in creating plausible but incorrect causal relationships.
        Your task is to modify a causal relationship between two variables to make it sound plausible
        but actually be incorrect in terms of the true causal mechanism.
      usr_prompt: |
        I have two variables with the following relationship:
        - First variable - {{ source }}
        - Second variable - {{ target }}
        - Current relationship: {{ relationship }}
        - Current motivation: {{ motivation }}

        Please provide a new motivation that:
        1. Sounds scientifically plausible
        2. Uses appropriate academic language and tone
        3. Contains a subtle but fundamental flaw in causal reasoning
        4. Still connects the two variables but with incorrect mechanism
        5. Is approximately the same length as the original
        6. IMPORTANT: Always refer to the variables by their actual names "{{ source }}" and "{{ target }}", not as "Variable 1" or "Variable 2"

        Provide ONLY the new motivation text with no additional commentary or explanations.
      usr_prompt_extension: ""
    version: 0.0.1
  - prompt_id: judgeCitation
    variables:
      - name: source
        type: string
        description: The source variable in the relationship
      - name: target
        type: string
        description: The target variable in the relationship
      - name: relationship
        type: string
        description: The type of relationship between the variables
      - name: motivation
        type: string
        description: The motivation explaining the relationship
      - name: citations
        type: string
        description: The content of cited sources formatted as text
    prompts:
      sys_prompt: |
        You are a precise and fair judge evaluating whether scientific claims are supported by their cited sources.
        Your job is to carefully read the relationship motivation and the cited sources, and determine if the motivation is supported.
        Base your judgment only on the content of the citations provided, not on general knowledge.
      usr_prompt: |
        Verify if this relationship is supported by its citations:
        
        SOURCE VARIABLE: {{ source }}
        TARGET VARIABLE: {{ target }}
        RELATIONSHIP TYPE: {{ relationship }}
        MOTIVATION: {{ motivation }}
        
        Here are the contents of the cited sources:
        {{ citations }}
        
        Based on the cited sources, evaluate if the relationship motivation is supported by the citations.
        
        Respond in this format:
        VERDICT: [SUPPORTED|PARTIALLY_SUPPORTED|CONTRADICTED|UNADDRESSED]
        REASON: [brief explanation of your judgment]
      usr_prompt_extension: ""
    version: 0.0.1
     # -----------------------------------------------------------------------
  # NEW PROMPT for single citation judgment in per_citation_aggregate approach
  # -----------------------------------------------------------------------
  - prompt_id: fillInMissingCitations
    variables:
      - name: claim_text
        type: string
        description: The claim for which we want citations
    prompts:
      sys_prompt: |
        You are an expert literature-search assistant. Provide max 3 reputable scientific URLs 
        that support the following claim, plus a brief explanation of relevance (1–2 sentences). 
        If you find no evidence, reply exactly NO_EVIDENCE.

        Output must be in one of two forms:

        NO_EVIDENCE

        -- or --

        CITATION: <URL>
        RELEVANCE: <short statement>
      usr_prompt: |
        CLAIM:
        {{ claim_text }}

        Answer now.
      usr_prompt_extension: ""
    version: 0.0.1

  # -----------------------------------------------------------------------
  # NEW PROMPT for single citation judgment in per_citation_aggregate approach
  # -----------------------------------------------------------------------
  - prompt_id: judgeSingleCitation
    variables:
      - name: motivation
        type: string
        description: The motivation text
      - name: citation_content
        type: string
        description: The text from one citation
    prompts:
      sys_prompt: |
        You are a precise, fair judge evaluating if a claim (the "motivation")
        is supported by ONE citation. Base your judgment ONLY on that citation.
      usr_prompt: |
        MOTIVATION: {{ motivation }}

        CITATION CONTENT:
        {{ citation_content }}

        Respond EXACTLY in this format:
        VERDICT: [SUPPORTED | PARTIALLY_SUPPORTED | CONTRADICTED | UNADDRESSED]
        REASON: [brief explanation]
      usr_prompt_extension: ""
    version: 0.0.1

  # -----------------------------------------------------------------------
  # NEW PROMPT for the aggregator step in per_citation_aggregate
  # -----------------------------------------------------------------------
  - prompt_id: judgeAggregator
    variables:
      - name: partial_results
        type: string
        description: The partial results summary text
    prompts:
      sys_prompt: |
        You are an aggregator. You see partial verdicts for multiple citations. 
        Each citation is judged fully, partially, or not supported. 
        Produce EXACTLY one final label:
        - Fully supported
        - Partially supported
        - Not supported
      usr_prompt: |
        PARTIAL RESULTS:
        {{ partial_results }}

        Please respond with EXACTLY one of these lines:
        Fully supported
        Partially supported
        Not supported
      usr_prompt_extension: ""
    version: 0.0.1

  # -----------------------------------------------------------------------
  # NEW PROMPT for the "one_causal_source_found" approach
  # -----------------------------------------------------------------------
  - prompt_id: judgeOneCausalSourceFound
    variables:
      - name: motivation
        type: string
        description: The motivation text
      - name: citations
        type: string
        description: The text from all citations
    prompts:
      sys_prompt: |
        You are a precise judge checking if these citations provide direct causal evidence
        for the motivation below. Only rely on the text below.
      usr_prompt: |
        MOTIVATION: {{ motivation }}

        ALL CITATIONS:
        {{ citations }}

        Respond EXACTLY with one of:
        CAUSAL
        NOT_CAUSAL
      usr_prompt_extension: ""
    version: 0.0.1