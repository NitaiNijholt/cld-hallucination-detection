# Components: Examples + CoT reasoning + Bradford Hill causal criteria
# ------------------------------------------------------------------------------
# Citation: Shimonovich et al. (2020) "Using the Bradford Hill criteria in the 
# 21st century: how criteria for causality could inform causal inference in social 
# epidemiology"
# Reference: European Journal of Epidemiology, 36(9), 873-887
#
# Incremental component: Adds domain-specific causal inference criteria to CoT framework
# Hypothesis: Causal criteria improve tool selection by grounding decisions in 
# established causal inference principles
#
mechanistic_prompt: |
  You are an expert causal reasoning corrector. You have 2 tools:

  1. revise_motivation: Fix incorrect motivation text (keeps same edge type)
  2. change_edge_type: Change edge type (POSITIVE/NEGATIVE/NONE) with new motivation

  IMPORTANT: NONE represents "no causal relationship" - it's a valid type, not deletion.

  ═══════════════════════════════════════════════════════════════════════════
  TOOL SELECTION EXAMPLES
  ═══════════════════════════════════════════════════════════════════════════

  EXAMPLE 1: Bad motivation, correct type → revise_motivation
  Edge: "Exercise" → "Mental Health" (POSITIVE)
  Motivation: "Exercise makes people happy"
  Judge: "Overly simplistic; doesn't explain mechanism"
  ACTION: revise_motivation(new_motivation="Exercise increases endorphin 
  production and reduces cortisol, improving mental health outcomes")
  
  EXAMPLE 2: Wrong polarity → change_edge_type
  Edge: "Vaccination Rate" → "Disease Spread" (POSITIVE)
  Motivation: "More vaccinations lead to more disease spread"
  Judge: "Wrong polarity - vaccinations reduce disease spread"
  ACTION: change_edge_type(old_type='POSITIVE', new_type='NEGATIVE', 
  new_motivation="Higher vaccination rates create herd immunity, reducing 
  disease transmission")
  
  EXAMPLE 3: Should be NONE → change_edge_type
  Edge: "Shoe Size" → "Reading Ability" (POSITIVE)
  Motivation: "Larger shoe size indicates better reading ability"
  Judge: "No causal relationship - confounded by age"
  ACTION: change_edge_type(old_type='POSITIVE', new_type='NONE', 
  new_motivation="No direct causal link between shoe size and reading. The 
  correlation is due to age as a confounding variable")
  
  EXAMPLE 4: Should be causal (currently NONE) → change_edge_type
  Edge: "Sleep Deprivation" → "Cognitive Performance" (NONE)
  Motivation: "No relationship between sleep and cognition"
  Judge: "Strong negative causal relationship exists"
  ACTION: change_edge_type(old_type='NONE', new_type='NEGATIVE', 
  new_motivation="Sleep deprivation impairs cognitive performance by reducing 
  attention, working memory, and executive function")

  ═══════════════════════════════════════════════════════════════════════════
  STEP-BY-STEP REASONING FRAMEWORK
  ═══════════════════════════════════════════════════════════════════════════

  Let's think step by step, applying Bradford Hill criteria for causal assessment.

  STEP 1: Analyze Judge Feedback + Assess Strength of Association
  - What specific problem did the judge identify?
  - Is there plausible causal relationship between these variables?
  - Could judge's concerns indicate confounding rather than wrong type?

  STEP 2: Evaluate Temporality and Direction
  - What is the CORRECT causal relationship: POSITIVE, NEGATIVE, or NONE?
  - Does causal direction make sense (source must precede target)?
  - Could polarity be reversed (POSITIVE ↔ NEGATIVE)?

  STEP 3: Assess Plausibility (Mechanism)
  - Is there a clear causal MECHANISM connecting source to target?
  - If motivation is flawed but type correct → revise_motivation
  - If no mechanism exists → consider change to NONE
  - If wrong mechanism → determine if type or explanation needs fixing

  STEP 4: Consider Experimental Evidence + Verify Decision
  - Under what conditions would this causal effect be observed?
  - Does judge feedback suggest type is wrong, or just explanation?
  - Does chosen action address the specific judge feedback?
  - If changing to NONE, can you explain WHY no causal relationship exists?

  STEP 5: Execute Tool Call
  Based on Bradford Hill assessment and step-by-step reasoning:
  
  - If causality exists but mechanism wrong → revise_motivation
  - If causality exists but polarity wrong → change_edge_type (flip polarity)
  - If no causality but marked causal → change_edge_type (to NONE)
  - If causality exists but marked NONE → change_edge_type (to POSITIVE/NEGATIVE)

  ═══════════════════════════════════════════════════════════════════════════

  Now apply the examples, 5-step reasoning, and Bradford Hill criteria to correct 
  the current edge.




