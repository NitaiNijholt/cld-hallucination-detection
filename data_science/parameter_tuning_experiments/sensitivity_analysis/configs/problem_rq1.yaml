# Sobol Sensitivity Analysis Problem Definition for RQ1
# Research Question 1: LLM-as-a-Judge and Corrector

problem_name: "RQ1 Sensitivity Analysis - LLM Judge/Corrector"

parameters:
  - name: "corruption_rate"
    description: "Rate of edge corruption (0.0 to 1.0)"
    bounds: [0.0, 1.0]
    type: "continuous"
  
  - name: "judge_temperature"
    description: "Temperature for LLM judge"
    bounds: [0.0, 1.0]
    type: "continuous"
  
  - name: "num_judges"
    description: "Number of judges for consensus"
    bounds: [1, 5]
    type: "discrete"
    values: [1, 3, 5]
  
  - name: "corrector_temperature"
    description: "Temperature for correction model"
    bounds: [0.0, 1.0]
    type: "continuous"
  
  - name: "generator_temperature"
    description: "Temperature for edge generation"
    bounds: [0.3, 1.0]
    type: "continuous"

outcome_metrics:
  - name: "accuracy"
    description: "Overall classification accuracy"
  
  - name: "precision"
    description: "Precision for hallucination detection"
  
  - name: "recall"
    description: "Recall for hallucination detection"
  
  - name: "f1_score"
    description: "F1 score"
  
  - name: "correction_success_rate"
    description: "Rate of successful corrections"

fixed_params:
  judge_edges: true
  run_correction: true
  embedding_enable: false
  plot_graph: false
  dev_mode: false
  export_json: true
  parallel: false

sensitivity_config:
  n_samples: 128
  calc_second_order: true
  seed: 42





