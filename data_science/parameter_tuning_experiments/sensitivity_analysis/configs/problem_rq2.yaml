# Sobol Sensitivity Analysis Problem Definition for RQ2
# Research Question 2: Context-Insensitive Metrics for Hallucination Detection

problem_name: "RQ2 Sensitivity Analysis - CI Metrics"

parameters:
  - name: "judge_temperature"
    description: "Temperature parameter for LLM judge (affects judgment variability)"
    bounds: [0.0, 1.0]
    type: "continuous"
    
  - name: "num_judges"
    description: "Number of judges used for consensus (1, 3, or 5)"
    bounds: [1, 5]
    type: "discrete"
    values: [1, 3, 5]
  
  - name: "ci_overlap_ratio"
    description: "Overlap ratio for CI metric computation (window sliding)"
    bounds: [0.0, 0.5]
    type: "continuous"
  
  - name: "generator_temperature"
    description: "Temperature for edge generation (affects generation diversity)"
    bounds: [0.3, 1.0]
    type: "continuous"

# Outcome metrics that will be analyzed
outcome_metrics:
  - name: "accuracy"
    description: "Overall classification accuracy (TP+TN)/(TP+TN+FP+FN)"
  
  - name: "precision"
    description: "Precision for hallucination detection TP/(TP+FP)"
  
  - name: "recall"
    description: "Recall for hallucination detection TP/(TP+FN)"
  
  - name: "f1_score"
    description: "F1 score for hallucination detection"
  
  - name: "auc_roc"
    description: "Area under ROC curve (if applicable)"

# Fixed parameters (not varied in sensitivity analysis)
fixed_params:
  corruption_rate: 0.0  # No corruption for RQ2
  judge_edges: true
  embedding_enable: true
  ci_fetch_reuse: true
  run_correction: false
  plot_graph: false
  dev_mode: false
  export_json: true
  parallel: false

# Sensitivity analysis configuration
sensitivity_config:
  n_samples: 128  # Base sample size (will generate 128*(2*4+2) = 1280 total samples)
  calc_second_order: true  # Calculate pairwise interactions
  seed: 42  # Reproducibility





