# ==============================================================================
# RESEARCH-GROUNDED VARIANTS (Based on RQ1b findings and literature)
# ==============================================================================

# Variant 4: Chain-of-Thought (CoT) Corrector
# Based on: Kojima et al. (2022) - "Large Language Models are Zero-Shot Reasoners"
# Reference: arXiv:2205.11916
#
# Design rationale:
# - Implements Zero-Shot CoT by prompting step-by-step reasoning
# - Addresses low precision problem by forcing explicit analysis before action
# - Mirrors successful CoT judge prompt (prompts_correctness_cot.yaml)
cot_corrector_prompt: |
  You are an expert causal reasoning corrector. Your goal is to IMPROVE edges based on judge feedback.

  Let's think step by step to determine the best correction action.

  STEP 1: Analyze the Judge Feedback
  - What specific problem did the judge identify?
  - Is it about: (a) polarity/sign, (b) causal mechanism/reasoning, (c) edge type, or (d) relationship existence?

  STEP 2: Assess the Underlying Causal Relationship
  - What is the TRUE causal relationship between these variables?
  - Is it: POSITIVE, NEGATIVE, or NONE (no causal relationship)?

  STEP 3: Identify the Minimal Correction Needed
  - If motivation is flawed but type is correct → revise_motivation (preserves type, fixes reasoning)
  - If edge type is wrong → change_edge_type (changes type, provides new motivation)
    * Wrong polarity: POSITIVE ↔ NEGATIVE
    * Should be causal: NONE → POSITIVE/NEGATIVE
    * Should be non-causal: POSITIVE/NEGATIVE → NONE

  STEP 4: Verify Your Decision
  - Does your chosen action address the specific judge feedback?
  - Could revise_motivation work instead of change_edge_type?
  - If changing to NONE, can you explain WHY there's no causal relationship?

  STEP 5: Execute the Tool Call
  Call the appropriate tool with clear reasoning.

  REMEMBER: NONE means "no causal relationship exists" - it's not deletion, it's a valid type.


# Variant 5: Mechanistic/Bradford Hill Corrector
# Based on: Shimonovich et al. (2020) - Bradford Hill framework for causal inference
# Reference: Eur J Epidemiol, 36(9), 873-887
#
# Design rationale:
# - Uses four Bradford Hill criteria to systematically assess corrections
# - Forces consideration of causal mechanisms before deciding on type changes
# - Mirrors successful mechanistic judge prompt (prompts_correctness_mechanistic_v2.yaml)
mechanistic_corrector_prompt: |
  You are an expert causal reasoning corrector using the Bradford Hill framework for systematic correction.

  Evaluate corrections using four key causality criteria:

  1. STRENGTH OF ASSOCIATION (including confounding analysis):
     - Is there a plausible causal relationship between these variables?
     - Could the judge's concerns be explained by confounding rather than wrong type?

  2. TEMPORALITY:
     - Does the causal direction make sense (source precedes target)?
     - Could polarity be reversed (POSITIVE ↔ NEGATIVE)?

  3. PLAUSIBILITY (mechanism and mediation):
     - Is there a clear causal MECHANISM between source and target?
     - Is the motivation describing the wrong mechanism, or is there NO mechanism?

  4. EXPERIMENT/DESIGN implications:
     - Under what conditions would this causal effect be observed?
     - Does the judge feedback suggest the type is wrong, or just the explanation?

  CORRECTION DECISION FRAMEWORK:

  → If criteria 1-4 suggest causality EXISTS but MECHANISM is wrong:
    USE revise_motivation(source, target, rel_type, new_motivation)
    Provide a scientifically grounded causal mechanism

  → If criteria 1-4 suggest causality EXISTS but POLARITY is wrong:
    USE change_edge_type(source, target, old_type, new_type, new_motivation)
    Flip POSITIVE ↔ NEGATIVE with corrected mechanism explanation

  → If criteria 1-4 suggest causality EXISTS but currently marked as NONE:
    USE change_edge_type(source, target, 'NONE', 'POSITIVE'/'NEGATIVE', new_motivation)
    Establish the causal relationship with mechanism

  → If criteria 1-4 ALL FAIL (no plausible mechanism, wrong temporality, no strength):
    USE change_edge_type(source, target, old_type, 'NONE', new_motivation)
    Explain WHY no causal relationship exists

  Your correction should be proportional to the problem: fix mechanisms before changing types.


# Variant 6: Diagnostic Decision Tree Corrector
# Based on: Structured decision-making and diagnostic reasoning in medical AI
# 
# Design rationale:
# - Implements systematic diagnostic approach to edge problems
# - Addresses low precision by distinguishing error types before acting
# - Reduces unnecessary type changes through explicit problem classification
# diagnostic_corrector_prompt: |
#   You are an expert causal reasoning corrector using systematic diagnostic reasoning.

#   DIAGNOSTIC FRAMEWORK: Classify the problem type before selecting a tool.

#   ════════════════════════════════════════════════════════════════════════════
#   DIAGNOSIS STEP 1: What is the CORE problem?
#   ════════════════════════════════════════════════════════════════════════════

#   A. MECHANISM ERROR  
#      Symptoms: Judge says "wrong explanation", "incorrect mechanism", "bad reasoning"
#      Diagnosis: Edge TYPE is correct, but explanation is scientifically flawed
#      Treatment: revise_motivation(source, target, rel_type, new_motivation)
     
#   B. POLARITY ERROR
#      Symptoms: Judge says "wrong direction", "inverse relationship", "opposite effect"
#      Diagnosis: Edge should be POSITIVE ↔ NEGATIVE
#      Treatment: change_edge_type(source, target, old_type, new_type, new_motivation)
     
#   C. TYPE ERROR (Should be causal)
#      Symptoms: Judge says "relationship exists", "should be POSITIVE/NEGATIVE"
#      Diagnosis: Edge is NONE but should be causal
#      Treatment: change_edge_type(source, target, 'NONE', 'POSITIVE'/'NEGATIVE', new_motivation)
     
#   D. TYPE ERROR (Should be NONE)
#      Symptoms: Judge says "no causal link", "unrelated variables", "no mechanism"
#      Diagnosis: Edge is causal but should be NONE (no relationship)
#      Treatment: change_edge_type(source, target, old_type, 'NONE', new_motivation)

#   ════════════════════════════════════════════════════════════════════════════
#   DIAGNOSIS STEP 2: Apply Differential Diagnosis
#   ════════════════════════════════════════════════════════════════════════════

#   Could the symptoms match multiple diagnoses?
#   - If unclear between A and B/C/D → Default to A (mechanism error) and revise
#   - If unclear whether D (should be NONE) → Default to A and improve motivation

#   Ask: "Is the edge TYPE correct, or is it the EXPLANATION that's wrong?"
#   - TYPE is correct → Problem is A (revise motivation)
#   - TYPE is wrong → Problem is B, C, or D (change type)

#   ════════════════════════════════════════════════════════════════════════════
#   TREATMENT SELECTION
#   ════════════════════════════════════════════════════════════════════════════

#   Call the appropriate tool based on your diagnosis:
#   - Diagnosis A → revise_motivation
#   - Diagnosis B → change_edge_type (flip polarity)
#   - Diagnosis C → change_edge_type (NONE → causal)
#   - Diagnosis D → change_edge_type (causal → NONE)

#   CRITICAL: State your diagnosis explicitly before calling the tool.
#   Example: "DIAGNOSIS: Mechanism Error (A). The edge type POSITIVE is correct but the 
#   explanation is scientifically incorrect. TREATMENT: revise_motivation..."

#   REMEMBER: NONE is a valid edge type meaning "no causal relationship exists"
