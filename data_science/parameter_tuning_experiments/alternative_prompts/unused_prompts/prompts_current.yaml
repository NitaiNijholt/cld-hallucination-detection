prompts:
  - prompt_id: generateNodes
    variables:
      - name: target
        type: string
        description: The target variable for the Model.
      - name: target_units
        type: string
        description: Units by which the Target is measured.
      - name: target_definition
        type: string
        description: The user provided definition of the selected target variable.
      - name: temporal
        type: string
        description: The temporal scale of the causality study.
      - name: spatial
        type: string
        description: The spatial scale of the causality study.
      - name: context
        type: list
        description: List of key contextual factors for the Model
    prompts:
      sys_prompt: >
        You are a systems modeling assistant. Your role is to identify a single, clearly defined, directly causal variable that influences a target variable within a specific context, time, and space. The variable must be measurable, not composite, and must not overlap with the target or any excluded variables. Respond only with a json including the variable name and its concise definition, formatted as: {"Variable":"Concise name of the variable", "Definition":"Definition of the variable", "Units":"Units of measurements for the variable"}, with no additional text.
      usr_prompt: |
        Target Variable: {{ target.title() }} (measured in {{ target_units }})
        Temporal Scale: {{ temporal.title() }}
        Spatial Scale: {{ spatial.title() }}
        Context: {{ context | join(', ') }}
        Name a variable (2,3 words) with a direct causal effect on the target variable {{ target.lower() }}, defined as "{{ target_definition.lower() }}"",
        over the timeframe {{ temporal.lower() }} and spatial scale {{ spatial.lower() }}. 
        Make sure the variable is acutely measurable, and is not a composite. 
        Be concise, and give the name of the variable and a short description, as well as the units by which it is measured. 
        The output must be exactly in the format of the following example: 
        {"Variable":"Concise name of the variable", 
        "Definition":"Definition of the variable", 
        "Units":"Units of measurements for the variable"}

      usr_prompt_extension: " The variable cannot be the same as or overlap with anything in the following list: "
    version: 0.0.1
  - prompt_id: generateEdges
    variables:
      - name: var1
        type: str
        description: First variable in undefined relationship.
      - name: var2
        type: str
        description: Second variable in undefined relationship.
      - name: def1
        type: str
        description: Definition of first variable.
      - name: def2
        type: str
        description: Definition of second variable.
      - name: spatial
        type: str
        description: The spatial scale of the causality study.
      - name: temporal
        type: str
        description: The temporal scale of the causality study.
      - name: variables
        type: list[string]
        description: List of existing variables in the CLD.
    prompts:
       sys_prompt: >
        You are a scientific reasoning agent specializing in causal loop diagrams. Given two variables and their definitions, your task is to determine the precise causal relationship between them using one of seven predefined types. Select the most appropriate type based on causal logic, not mere correlation. Respond with a dictionary: {"Relationship":"TYPE","Explanation"."A brief explanation.""}. Make sure there is no additional text.
       usr_prompt: | 
        If there is a relationship between "{{ var1 }}" and "{{ var2 }}", define the causal relationship between "{{ var1 }}" and "{{ var2 }}" in a Causal Loop Diagram (CLD). However, if there is no relationship, or the relationship is not direct or causal, respond with "NONE". 
        
        Make sure to evaluate the type and existence of the causal relationship only in terms of the spatial scale of "{{ spatial }}" and temporal scale of "{{ temporal }}".

        If there is a relationship, choose the corresponding edge type to represent the relationship:
        1. POSITIVE – An increase in "{{ var1 }}" causes an increase in "{{ var2 }}", or a decrease in "{{ var1 }}" causes a decrease in "{{ var2 }}" (direct relationship).
        2. NEGATIVE – An increase in "{{ var1 }}" causes a decrease in "{{ var2 }}", or a decrease in "{{ var1 }}" causes an increase in "{{ var2 }}" (inverse relationship).
        3. DELAYED – A positive or negative causal relationship where the effect is delayed over time.
        4. NONLINEAR – The effect of "{{ var1 }}" on "{{ var2 }}" is not strictly linear and may depend on thresholds or saturation.
        5. NONE – No causal relationship exists between "{{ var1 }}" and "{{ var2 }}".

        
        Provide a brief, maximum 4-sentence explanation in the format: {"Relationship":"TYPE","Explanation":"A brief explanation."}

        Example Responses:
        1. For a Positive Relationship:
          RELATIONSHIP:POSITIVE:Increasing the force on an object of constant mass directly and causally increases its acceleration. Conversely, reducing the force directly and causally decreases the acceleration.
        2. For a Negative Relationship:
          RELATIONSHIP:NEGATIVE:Increasing electrical resistance in a circuit directly and causally reduces the current flow (assuming constant voltage). Decreasing the resistance directly and causally increases the current.
        3. For a Reinforcing Loop:
          RELATIONSHIP:REINFORCING_LOOP:An increase in a rabbit population directly and causally leads to more breeding pairs,which in turn directly and causally results in even more offspring, reinforcing continued population growth over time.
        4. For a Delayed Relationship:
          RELATIONSHIP:DELAYED:Planting seeds in fertile soil directly and causally leads to plant growth, but there is a delay because seeds need time to germinate and develop roots before sprouting.
        5. For a Nonlinear Relationship:
          RELATIONSHIP:NONLINEAR: Increasing substrate concentration directly and causally raises the rate of an enzyme-catalyzed reaction up to a saturation point.Beyond that point, further increases have diminishing effects, showing a nonlinear causal relationship.
        6. For No Relationship:
          RELATIONSHIP:NONE:There is no known direct causal link between the number of birds in a city and the stock market performance.


        WARNING: Check for mediators. If the direct causal relationship is mediated by other variables already in the CLD, namely: {{ variables | join(", ") }}, do not create a new relationship between "{{ var1 }}" and "{{ var2 }}" and instead respond with: {"Relationship":"NONE","Explanation"."A mediating variable (name the specific mediator) is already present in the CLD that explains the relationship between "{{ var1 }}" and "{{ var2 }}".""}
    
        Now, define the relationship between "{{ var1 }}" ("{{ def1 }}") and "{{ var2 }}" ("{{ def2 }}") following this format, taking particular care to make sure the relationships are causal and not just correlated or associated. 

       usr_prompt_extension: ""
    version: 0.0.1
  - prompt_id: edgeVerifier
    variables:
      - name: edge_description
        type: string
        description: The textual description for an edge relationship
    prompts:
      sys_prompt: |
        Be precise. Only respond with either:
        - OK
        - INCONSISTENT:<short reason>

      usr_prompt: |
        Evaluate the following edge description for internal or logical consistency:
        "{{ edge_description }}"

        Step 1: Identify the proposed cause and effect variables.
        Step 2: Analyze the temporal sequence (cause must precede effect).
        Step 3: Assess plausible causal mechanisms.
        Step 4: Identify potential confounders or mediators.
        Step 5: Check for logical fallacies or reasoning errors.
        Step 6: Evaluate if evidence supports a direct causal link.
        Step 7: Provide your final judgment (OK or INCONSISTENT).

        If the description is self-consistent, respond with `OK`.
        If the description is not self-consistent, respond with `INCONSISTENT:` 
        followed by a **brief** explanation.

      usr_prompt_extension: ""
  - prompt_id: generateSpuriousMotivation
    variables:
      - name: source
        type: string
        description: The source variable in the relationship
      - name: target
        type: string
        description: The target variable in the relationship  
      - name: relationship
        type: string
        description: The type of relationship between the variables
      - name: motivation
        type: string
        description: The original motivation for the relationship
    prompts:
      sys_prompt: |
        You are an expert in creating plausible but incorrect causal relationships.
        Your task is to modify a causal relationship between two variables to make it sound plausible
        but actually be incorrect in terms of the true causal mechanism.
      usr_prompt: |
        I have two variables with the following relationship:
        - First variable - {{ source }}
        - Second variable - {{ target }}
        - Current relationship: {{ relationship }}
        - Current motivation: {{ motivation }}

        Please provide a new motivation that:
        1. Sounds scientifically plausible
        2. Uses appropriate academic language and tone
        3. Contains a subtle but fundamental flaw in causal reasoning
        4. Still connects the two variables but with incorrect mechanism
        5. Is approximately the same length as the original
        6. IMPORTANT: Always refer to the variables by their actual names "{{ source }}" and "{{ target }}", not as "Variable 1" or "Variable 2"

        Provide ONLY the new motivation text with no additional commentary or explanations.
      usr_prompt_extension: ""
    version: 0.0.1
  - prompt_id: judgeCitation
    variables:
      - name: source
        type: string
        description: The source variable in the relationship
      - name: target
        type: string
        description: The target variable in the relationship
      - name: relationship
        type: string
        description: The type of relationship between the variables
      - name: motivation
        type: string
        description: The motivation explaining the relationship
      - name: citations
        type: string
        description: The content of cited sources formatted as text
    prompts:
      sys_prompt: |
        You are a precise and fair judge evaluating whether scientific claims are supported by their cited sources.
        Your job is to carefully read the relationship motivation and the cited sources, and determine if the motivation is supported.
        Base your judgment only on the content of the citations provided, not on general knowledge.
      usr_prompt: |
        Verify if this relationship is supported by its citations:
        
        SOURCE VARIABLE: {{ source }}
        TARGET VARIABLE: {{ target }}
        RELATIONSHIP TYPE: {{ relationship }}
        MOTIVATION: {{ motivation }}
        
        Here are the contents of the cited sources:
        {{ citations }}
        
        Based on the cited sources, evaluate if the relationship motivation is supported by the citations.
        
        Respond in this format:
        VERDICT: [SUPPORTED|PARTIALLY_SUPPORTED|CONTRADICTED|UNADDRESSED]
        REASON: [brief explanation of your judgment]
      usr_prompt_extension: ""
    version: 0.0.1
  - prompt_id: simpleSamenessCheck
    variables:
      - name: source
        type: string
        description: The thing to compare
      - name: target
        type: string
        description: The thing to compare to
    prompts:
      sys_prompt: |
        You are a helpful assistant that verifies if two things are consistent with each other. If they are, respond with "True". If they are not, respond with "False" and a brief explanation.
      usr_prompt: |
        Verify if SOURCE and TARGET things are effectively the same (semantically, i.e. in terms of meaning):
        
        SOURCE: {{ source }}
        TARGET: {{ target }}
        
        Respond in this format:
        VERDICT: [TRUE|FALSE]
        REASON: [brief explanation of your judgment]
      usr_prompt_extension: ""
    version: 0.0.1
     # -----------------------------------------------------------------------
  # NEW PROMPT for single citation judgment in per_citation_aggregate approach
  # -----------------------------------------------------------------------
     # -----------------------------------------------------------------------
  # NEW PROMPT for single citation judgment in per_citation_aggregate approach
  # -----------------------------------------------------------------------
  - prompt_id: fillInMissingCitations
    variables:
      - name: claim_text
        type: string
        description: The claim for which we want citations
    prompts:
      sys_prompt: |
        You are an expert literature-search assistant. Provide max 3 reputable scientific URLs 
        that support the following claim, plus a brief explanation of relevance (1–2 sentences). 
        If you find no evidence, reply exactly NO_EVIDENCE.

        Output must be in one of two forms:

        NO_EVIDENCE

        -- or --

        CITATION: <URL>
        RELEVANCE: <short statement>
      usr_prompt: |
        CLAIM:
        {{ claim_text }}

        Answer now.
      usr_prompt_extension: ""
    version: 0.0.1

  # -----------------------------------------------------------------------
  # NEW PROMPT for single citation judgment in per_citation_aggregate approach
  # -----------------------------------------------------------------------
  - prompt_id: judgeSingleCitation
    variables:
      - name: motivation
        type: string
        description: The motivation text
      - name: citation_content
        type: string
        description: The text from one citation
    prompts:
      sys_prompt: |
        You are a precise, fair judge evaluating if a claim (the "motivation")
        is supported by ONE citation. Base your judgment ONLY on that citation.
      usr_prompt: |
        MOTIVATION: {{ motivation }}

        CITATION CONTENT:
        {{ citation_content }}

        Respond EXACTLY in this format:
        VERDICT: [SUPPORTED | PARTIALLY_SUPPORTED | CONTRADICTED | UNADDRESSED]
        REASON: [brief explanation]
      usr_prompt_extension: ""
    version: 0.0.1

  # -----------------------------------------------------------------------
  # NEW PROMPT for the aggregator step in per_citation_aggregate
  # -----------------------------------------------------------------------
  - prompt_id: judgeAggregator
    variables:
      - name: partial_results
        type: string
        description: The partial results summary text
    prompts:
      sys_prompt: |
        You are an aggregator. You see partial verdicts for multiple citations. 
        Each citation is judged fully, partially, or not supported. 
        Produce EXACTLY one final label:
        - Fully supported
        - Partially supported
        - Not supported
      usr_prompt: |
        PARTIAL RESULTS:
        {{ partial_results }}

        Please respond with EXACTLY one of these lines:
        Fully supported
        Partially supported
        Not supported
      usr_prompt_extension: ""
    version: 0.0.1

  # -----------------------------------------------------------------------
  # NEW PROMPT for the "one_causal_source_found" approach
  # -----------------------------------------------------------------------
  - prompt_id: judgeOneCausalSourceFound
    variables:
      - name: motivation
        type: string
        description: The motivation text
      - name: citations
        type: string
        description: The text from all citations
    prompts:
      sys_prompt: |
        You are a precise judge checking if these citations provide direct causal evidence
        for the motivation below. Only rely on the text below.
      usr_prompt: |
        MOTIVATION: {{ motivation }}

        ALL CITATIONS:
        {{ citations }}

        Respond EXACTLY with one of:
        CAUSAL
        NOT_CAUSAL
      usr_prompt_extension: ""
    version: 0.0.1