prompts:
  - prompt_id: generateNodes
    variables:
      - name: target
        type: string
        description: The target variable for the Model.
      - name: target_definition
        type: string
        description: The user provided definition of the selected target variable.
      - name: temporal
        type: string
        description: The temporal scale of the causality study.
      - name: spatial
        type: string
        description: The spatial scale of the causality study.
      - name: context
        type: list
        description: List of key contextual factors for the Model
    prompts:
      sys_prompt: >
        You are a systems dynamics modeler. Your role is to propose a single new variable which (directly or indirectly) can influence, or can be influenced by, the specified target variable within the specified context, temporal scale, and spatial scale. The newly proposed variable must be clearly defined, quantifiable, and must not overlap with the definitions of the target or any other variables in the current list. Please use nouns or noun phrases for variable names, as recommended by system dynamics literature. In addition, the variable name must have clear directionality, meaning it should be immediately obvious what an increase or decrease in the variable means. For example, use "Deforestation Rate" rather than "Forest Condition," or "Public Health Investment" rather than "Health Situation." Ensure the variable can be quantified on a scale where the meaning of "more" or "less" is unambiguous. Respond as follows: the variable name, its concise definition, its unit of measurement, its temporal scale (i.e., an indication of how long it takes for an appreciable change to occur in the value of this variable, using a word such as seconds, minutes, hours, days, years, etc.), its spatial scale (relative to the context: an indication of what part of the system is referred to by this variable), all separated by colons, with no additional commentary or formatting.
      usr_prompt: |
        Target Variable: {{ target.title() }};
        Temporal Scale: {{ temporal.title() }};
        Spatial Scale: {{ spatial.title() }};
        Context: {{ context | join(', ') }}.

        Propose a new variable (1 to 3 words) to be added to the existing variable list (listed below) which (directly or indirectly) can influence, or can be influenced by, the target variable "{{ target.lower() }}", defined as "{{ target_definition.lower() }}",
        appreciably over the timeframe {{ temporal.lower() }} and spatial scale {{ spatial.lower() }}. 
        The newly proposed variable must be clearly defined, quantifiable, and must not overlap with the definitions of the target or any other variables in the current list. 
        Respond the following: the variable name, its concise definition, its unit of measurement, its temporal scale (an indication of how long it takes for an appreciable change to occur in the value of this variable), its spatial scale (relative to the context: an indication of what part of the system is referred to by this variable), all separated by colons, with no additional commentary or formatting. 

        The output must be strictly formatted as follows: 
        
        {"Variable":"Concise name of the variable", 
        "Definition":"Definition of the variable", 
        "Units":"Units of measurements for the variable"} 
      usr_prompt_extension: " The variable cannot already be part of or overlap with any existing variable in the following list: "
    version: "0.0.1"

  - prompt_id: generateEdges
    variables:
      - name: var1
        type: str
        description: First variable in undefined relationship.
      - name: var2
        type: str
        description: Second variable in undefined relationship.
      - name: def1
        type: str
        description: Definition of first variable.
      - name: def2
        type: str
        description: Definition of second variable.
      - name: spatial
        type: str
        description: The spatial scale of the causality study.
      - name: temporal
        type: str
        description: The temporal scale of the causality study.
      - name: variables
        type: list[string]
        description: List of existing variables in the CLD.
    prompts:
      sys_prompt: >
        You are a system dynamics modeler tasked with constructing a causal loop diagram. Given two variables and their definitions, your task is to determine whether or not there is a direct causal relationship from the first to the second variable, as reported by trustworthy sources such as scientific literature, graduate textbooks, and official reports. If so, please classify the causal relationship using one of the predefined types. A causal relationship is 'direct' if the causation is not fully mediated by the other variables currently in the diagram (think of the concept of D-separation in causal discovery). Make sure that you only deem a causal relationship to be present if and only if there is indeed a direct causation (i.e., a change in the first variable leads to a change in the second variable, over a certain temporal scale) and not merely a correlation/association. Return your answer in JSON format with "Relationship" and "Explanation" fields.
      usr_prompt: | 
        Determine whether there is a direct causal relationship between "{{ var1 }}" and "{{ var2 }}", within the spatial scale of "{{ spatial }}" and temporal scale of "{{ temporal }}".
        
        If there is no relationship, or the relationship is not direct or causal, then your answer should set "Relationship" to one of these values:
        - NONE: there is no causation whatsoever (mediated or not) from the first to the second variable. 
        - INDIRECT: there is an indirect causal relationship, i.e., mediated by other variable(s) in the current list. 
        - SLOW: the causal relationship may in principle be possible, but under the temporal scale of the model to be developed, the causation is too slow and can effectively be considered as non-existent. 
        - OUTOFCONTEXT: the causal relationship may in principle be possible, but within the specified context, the causation is impossible and thus can effectively be considered as non-existent. 
        - UNKNOWN: either there are no reports of this causation, or there are conflicting reports, making it too unsure to include it in our diagram.
        
        Alternatively, if there is a direct causal relationship, then set "Relationship" to one of these values:
        - POSITIVE: An increase in "{{ var1 }}" causes an increase in "{{ var2 }}", or a decrease in "{{ var1 }}" causes a decrease in "{{ var2 }}".
        - NEGATIVE: An increase in "{{ var1 }}" causes a decrease in "{{ var2 }}", or a decrease in "{{ var1 }}" causes an increase in "{{ var2 }}".
        - DELAYED: A positive or negative causal relationship where the effect is delayed over time.
        - NONLINEAR: The effect of "{{ var1 }}" on "{{ var2 }}" is not strictly linear or even monotonic, such as U-shaped and/or may depend on thresholds or saturation.
        - UNKNOWN: The causal relationship has been mentioned or implied, but its nature is either ambiguous or unknown. 
        
        In your "Explanation" field, specify the temporal scale of the causal relationship, meaning: an indication of how long it would take for a change in the first variable to lead to an appreciable change in the second variable.

        For a simple relationship, use maximum 4 sentences; for a complex relationship, use maximum 6 sentences.
        
        The current complete list of variables is: {{ variables | join(", ") }}.
        
        Respond only in the output format {"Relationship":"TYPE","Explanation":"A brief explanation of the causal mechanism and why it is a direct causation, or in case of no relationship, why not"}
      usr_prompt_extension: ""
    version: "0.0.1"

  - prompt_id: edgeVerifier
    variables:
      - name: edge_description
        type: string
        description: The textual description for an edge relationship
    prompts:
      sys_prompt: |
        Be precise. Only respond with either:
        - OK
        - INCONSISTENT:<short reason>
      usr_prompt: |
        Evaluate the following edge description for internal or logical consistency:
        "{{ edge_description }}"

        Step 1: Identify the proposed cause and effect variables.
        Step 2: Analyze the temporal sequence (cause must precede effect).
        Step 3: Assess plausible causal mechanisms.
        Step 4: Identify potential confounders or mediators.
        Step 5: Check for logical fallacies or reasoning errors.
        Step 6: Evaluate if evidence supports a direct causal link.
        Step 7: Provide your final judgment (OK or INCONSISTENT).

        If the description is self-consistent, respond with `OK`.
        If the description is not self-consistent, respond with `INCONSISTENT:` 
        followed by a **brief** explanation.
      usr_prompt_extension: ""
    version: "0.0.1"

  - prompt_id: generateSpuriousMotivation
    variables:
      - name: source
        type: string
        description: The source variable in the relationship
      - name: target
        type: string
        description: The target variable in the relationship
      - name: relationship
        type: string
        description: The type of relationship between the variables
      - name: motivation
        type: string
        description: The original motivation for the relationship
    prompts:
      sys_prompt: |
        You are an expert in creating plausible but incorrect causal relationships.
        Your task is to modify a causal relationship between two variables to make it sound plausible
        but actually be incorrect in terms of the true causal mechanism.
      usr_prompt: |
        I have two variables with the following relationship:
        - First variable - {{ source }}
        - Second variable - {{ target }}
        - Current relationship: {{ relationship }}
        - Current motivation: {{ motivation }}

        Please provide a new motivation that:
        1. Sounds scientifically plausible
        2. Uses appropriate academic language and tone
        3. Contains a subtle but fundamental flaw in causal reasoning
        4. Still connects the two variables but with incorrect mechanism
        5. Is approximately the same length as the original
        6. IMPORTANT: Always refer to the variables by their actual names "{{ source }}" and "{{ target }}", not as "Variable 1" or "Variable 2"

        Provide ONLY the new motivation text with no additional commentary or explanations.
      usr_prompt_extension: ""
    version: "0.0.1"

  - prompt_id: judgeCitation
    variables:
      - name: source
        type: string
        description: The source variable in the relationship
      - name: target
        type: string
        description: The target variable in the relationship
      - name: relationship
        type: string
        description: The type of relationship between the variables
      - name: motivation
        type: string
        description: The motivation explaining the relationship
      - name: citations
        type: string
        description: The content of cited sources formatted as text
    prompts:
      sys_prompt: |
        You are a precise and fair judge evaluating whether scientific claims are supported by their cited sources.
        Your job is to carefully read the relationship motivation and the cited sources, and determine if the motivation is supported.
        Base your judgment only on the content of the citations provided, not on general knowledge.
      usr_prompt: |
        Verify if this relationship is supported by its citations:
        
        SOURCE VARIABLE: {{ source }}
        TARGET VARIABLE: {{ target }}
        RELATIONSHIP TYPE: {{ relationship }}
        MOTIVATION: {{ motivation }}
        
        Here are the contents of the cited sources:
        {{ citations }}
        
        Based on the cited sources, evaluate if the relationship motivation is supported by the citations.
        
        Respond in this format:
        VERDICT: [SUPPORTED|PARTIALLY_SUPPORTED|CONTRADICTED|UNADDRESSED]
        REASON: [brief explanation of your judgment]
      usr_prompt_extension: ""
    version: "0.0.1"
 # -----------------------------------------------------------------------
  # NEW PROMPT for single citation judgment in per_citation_aggregate approach
  # -----------------------------------------------------------------------
     # -----------------------------------------------------------------------
  # NEW PROMPT for single citation judgment in per_citation_aggregate approach
  # -----------------------------------------------------------------------
  - prompt_id: fillInMissingCitations
    variables:
      - name: claim_text
        type: string
        description: The claim for which we want citations
    prompts:
      sys_prompt: |
        You are an expert literature-search assistant. Provide max 3 reputable scientific URLs 
        that support the following claim, plus a brief explanation of relevance (1–2 sentences). 
        If you find no evidence, reply exactly NO_EVIDENCE.

        Output must be in one of two forms:

        NO_EVIDENCE

        -- or --

        CITATION: <URL>
        RELEVANCE: <short statement>
      usr_prompt: |
        CLAIM:
        {{ claim_text }}

        Answer now.
      usr_prompt_extension: ""
    version: 0.0.1

  # -----------------------------------------------------------------------
  # NEW PROMPT for single citation judgment in per_citation_aggregate approach
  # -----------------------------------------------------------------------
  - prompt_id: judgeSingleCitation
    variables:
      - name: motivation
        type: string
        description: The motivation text
      - name: citation_content
        type: string
        description: The text from one citation
    prompts:
      sys_prompt: |
        You are a precise, fair judge evaluating if a claim (the "motivation")
        is supported by ONE citation. Base your judgment ONLY on that citation.
      usr_prompt: |
        MOTIVATION: {{ motivation }}

        CITATION CONTENT:
        {{ citation_content }}

        Respond EXACTLY in this format:
        VERDICT: [SUPPORTED | PARTIALLY_SUPPORTED | CONTRADICTED | UNADDRESSED]
        REASON: [brief explanation]
      usr_prompt_extension: ""
    version: 0.0.1

  # -----------------------------------------------------------------------
  # NEW PROMPT for the aggregator step in per_citation_aggregate
  # -----------------------------------------------------------------------
  - prompt_id: judgeAggregator
    variables:
      - name: partial_results
        type: string
        description: The partial results summary text
    prompts:
      sys_prompt: |
        You are an aggregator. You see partial verdicts for multiple citations. 
        Each citation is judged fully, partially, or not supported. 
        Produce EXACTLY one final label:
        - Fully supported
        - Partially supported
        - Not supported
      usr_prompt: |
        PARTIAL RESULTS:
        {{ partial_results }}

        Please respond with EXACTLY one of these lines:
        Fully supported
        Partially supported
        Not supported
      usr_prompt_extension: ""
    version: 0.0.1

  # -----------------------------------------------------------------------
  # NEW PROMPT for the "one_causal_source_found" approach
  # -----------------------------------------------------------------------
  - prompt_id: judgeOneCausalSourceFound
    variables:
      - name: motivation
        type: string
        description: The motivation text
      - name: citations
        type: string
        description: The text from all citations
    prompts:
      sys_prompt: |
        You are a precise judge checking if these citations provide direct causal evidence
        for the motivation below. Only rely on the text below.
      usr_prompt: |
        MOTIVATION: {{ motivation }}

        ALL CITATIONS:
        {{ citations }}

        Respond EXACTLY with one of:
        CAUSAL
        NOT_CAUSAL
      usr_prompt_extension: ""
    version: 0.0.1