# Configuration for comparing Andrew's prompt vs Old prompt
# 10 runs each to compare node generation performance

experiment_name: "node_gen_prompt_comparison_10runs"

# COMPARE TWO PROMPTS
prompt_files: 
  - "_nitai_only/prompts_Nitai_C_andrew_nodegen.yaml"  # Andrew's new prompt
  - "_nitai_only/prompts_Nitai_C.yaml"                 # Old prompt

# ALL REAL CLDs (excluding test) - 1 run each to verify consistency
excel_files:
  - "Depressive_symptoms_in_response_to_a_stressor_in_healthy_adults.xlsx"
  - "Social_norms_and_obesity_prevalence.xlsx"
  - "older_persons_emergency_department_visits_and_interactionstitled_spreadsheet.xlsx"

# PARAMETER GRID
param_grid:
  export_json: [true]
  plot_graph: [true]
  dev_mode: [false]
  
  # NODE GENERATION ONLY MODE
  node_generation_only: [true]
  
  # LLM CONFIGS
  generator_config:
    - provider: openai
      model: gpt-4.1
  
  corruptor_config:
    - provider: openai
      model: gpt-4.1
  
  judge_config:
    - provider: openai
      model: gpt-5-nano
  
  # VARIABLE GENERATION SETTINGS
  preload_validation_variables: [false]
  # Don't override target - use each CLD's own target variable
  
  # CONTEXT INFERENCE
  infer_context_from_validation: [true]
  
  # TEMPERATURES
  generator_temperature: [0.4]
  
  # CORRUPTION
  corruption_rate: [0.0]
  
  # JUDGING - Disabled
  judge_edges: [false]
  judge_models: [["gpt-5-nano"]]
  num_judges: [1]
  judge_temperature: [0.0]
  
  # CORRECTION - Disabled
  run_correction: [false]
  corrector_models: [["claude-4-sonnet-20250514"]]
  corrector_temperature: [0.4]
  
  # COMPARISON SETTINGS - Use LLM_BATCH mode for efficiency
  node_comparison_enable: [true]
  node_comparison_mode: ["llm_batch"]
  node_comparison_cosine_percentile: [90]
  node_comparison_cosine_model: ["text-embedding-3-small"]
  node_comparison_cosine_dimensions: [1536]

# 5 runs per prompt per CLD
runs: 5
