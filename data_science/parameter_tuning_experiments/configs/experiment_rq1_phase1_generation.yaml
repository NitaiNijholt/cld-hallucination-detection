# RQ1 Phase 1: Generation Only
# Generates 18 CLDs (3 CLDs × 2 corruption rates × 3 runs) WITHOUT judging
# Saves session IDs for Phase 2 judging (7 strategies per session = 126 total)
#
# STATISTICAL RATIONALE:
# - 3 runs × ~20 edges/CLD = ~60 edges per condition
# - Sufficient for power=0.8 to detect Δ F1 ≥ 0.08
# - Bootstrap CIs: ±0.05 (acceptable for thesis)
# - Total edges: ~2,520 across all conditions

experiment_name: "RQ1 Phase 1 - CLD Generation (No Judging)"

# 3 runs for statistical reliability (see rationale above)
runs: 3

# Test both corruption scenarios
corruption_rates: 
  - 0.5   # Mixed scenario (50% corrupted, 50% genuine)
  - 1.0   # All corrupted (baseline test)

# All 3 ground truth CLDs
excel_files:
  - Depressive_symptoms_in_response_to_a_stressor_in_healthy_adults.xlsx
  - Social_norms_and_obesity_prevalence.xlsx
  - older_persons_emergency_department_visits_and_interactionstitled_spreadsheet.xlsx

# Fixed generator configuration
generator_config:
  provider: openai
  model: gpt-4.1
  temperature: 0.7

# Corruptor: Mistral 7B Instruct (different architecture from all judges)
corruptor_config:
  provider: perplexity
  model: mistral-7b-instruct
  temperature: 0.7

# Prompt configuration
prompt_files:
  - prompts_Nitai_C.yaml

# Parameter grid: Just corruption rates (judging happens in Phase 2)
param_grid:
  - corruption_rate: [0.5, 1.0]

# CRITICAL: No judging in Phase 1 (saves ~80% of tokens/cost)
judge_edges: false

# Experimental settings
parallel: true
max_workers: 3
citation_search_provider: "brave"

# Context-insensitive metrics (not needed for Phase 1)
embedding_enable: false

# Output settings
plot_session_graph: false
plot_validation_graph: false
export_json: true

# EXPECTED OUTPUT:
# - 18 session IDs (3 CLDs × 2 rates × 3 runs)
# - Session IDs saved in param_combo_mapping_exp_<timestamp>_<id>.csv
# - Each session will be judged 7 times in Phase 2
# - Total Phase 2 experiments: 18 × 7 = 126
