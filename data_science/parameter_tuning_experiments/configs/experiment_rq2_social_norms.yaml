# RQ2 Social Norms - No Corruption
# Purpose: Get varied hallucination labels with cosine similarity

param_grid:
  # Basic settings
  export_json: [true]
  plot_graph: [false]
  dev_mode: [false]
  
  # Models
  generator_config:
    - { provider: "openai", model: "gpt-4o" }
  
  corruptor_config:
    - { provider: "openai", model: "gpt-4o" }
  
  judge_config:
    - { provider: "openai", model: "gpt-4o" }
  
  # NO CORRUPTION - Real edges only
  corruption_rate: [0.0]
  
  # JUDGING - ENABLED
  judge_edges: [true]
  judge_models: [["gpt-4o"]]
  num_judges: [1]
  judge_temperature: [0.3]
  
  # CITATION
  citation_search_provider: ["brave"]
  
  # NO CORRECTION
  run_correction: [false]
  
  # ENABLE CI METRICS INCLUDING COSINE SIMILARITY
  embedding_enable: [true]
  ci_fetch_reuse: [true]
  ci_chunk_chars_override: [null]
  ci_overlap_ratio: [0.2]
  
  # Temperatures
  generator_temperature: [0.7]
  corruptor_temperature: [0.7]
  
  # Parallelism
  parallel: [false]
  max_workers: [1]
  
  # Environment
  load_env: [true]
  
  # Plotting
  plot_session_graph: [false]
  plot_validation_graph: [false]
  
  # Comparison
  only_cited_edges: [false]
  only_consistent_edges: [false]
  filter_validation_nodes_to_session_nodes: [true]
  
  # Node comparison
  node_comparison_enable: [false]

# Social norms CLD
excel_files:
  - "Social_norms_and_obesity_prevalence.xlsx"

# 2 runs for more data
runs: 2

# Prompt
prompt_files:
  - "prompts_Nitai_C.yaml"