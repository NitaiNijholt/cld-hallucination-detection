# Train on GT Lit directly for an additional comparison experiment.
# This keeps the default GT Synth setup untouched.

defaults:
  - default

train_file: finetuning/data/gt_lit_trainval/judge_train_gtlit.xlsx
val_file: finetuning/data/gt_lit_trainval/judge_val_gtlit.xlsx
output_dir: finetuning/runs/mistral7b_judge_gtlit

load_best_model_at_end: true
wandb_group: gt_lit
